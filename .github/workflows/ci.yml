name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q multica tests
      - run: git diff --check
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install checksum-pinned Luau 0.745
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luau"
          curl --fail --location --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip \
            --output "$RUNNER_TEMP/luau.zip"
          printf '%s  %s\n' '186e5ddaa2b048ebc7390c11ed1b00c04e7d3beaffed429250329e3575d2ece2' "$RUNNER_TEMP/luau.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Run actual Luau entries with the Noctalia host fixture
        run: python tests/run_ui_tests.py
      - name: Check manifest and catalog agree
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          catalog = tomllib.loads(Path('catalog.toml').read_text())['plugin'][0]
          plugin = tomllib.loads(Path('multica/plugin.toml').read_text())
          for key in ('id', 'version', 'plugin_api'):
              assert catalog[key] == plugin[key], key
          PY
